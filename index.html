<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Minesweeper Solver (Custom Size)</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #2c3e50; color: white; margin-top: 20px;}
        .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .instructions { font-size: 14px; color: #bdc3c7; margin-bottom: 15px; text-align: center; line-height: 1.6;}
        button { padding: 8px 16px; font-size: 14px; cursor: pointer; border-radius: 4px; border: none; background-color: #3498db; color: white; font-weight: bold; transition: 0.1s;}
        button:hover { background-color: #2980b9; }
        
        .keypad { display: flex; gap: 6px; margin-bottom: 15px; background: #34495e; padding: 10px; border-radius: 8px; flex-wrap: wrap; justify-content: center;}
        .keypad button { background-color: #7f8c8d; padding: 10px 18px; font-size: 18px;}
        .keypad button:hover { background-color: #95a5a6; }
        .keypad button.active { background-color: #f1c40f !important; color: #2c3e50; box-shadow: 0 0 8px #f1c40f; transform: scale(1.1); }

        .settings-container { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .stats-panel { background-color: #1abc9c; padding: 8px 15px; border-radius: 6px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}
        .size-panel { background-color: #e67e22; padding: 8px 15px; border-radius: 6px; display: flex; align-items: center; gap: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}
        .settings-container input { width: 60px; padding: 5px; font-size: 14px; font-weight: bold; text-align: center; border: none; border-radius: 4px; outline: none;}
        .size-panel button { background-color: #d35400; padding: 6px 12px; margin-left: 5px; }
        .size-panel button:hover { background-color: #a84300; }

        .board-wrapper { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 30px;}
        
        .x-coords { display: grid; gap: 1px; margin-left: 32px; }
        .x-coords-top { margin-bottom: 4px; }
        .x-coords-bottom { margin-top: 4px; }
        
        .y-coords { display: grid; gap: 1px; width: 24px; margin-top: 3px; }
        .y-coords-left { margin-right: 5px; }
        .y-coords-right { margin-left: 5px; }
        
        .coord { display: flex; justify-content: center; align-items: center; font-size: 11px; color: #bdc3c7; font-weight: bold; user-select: none; }

        #board { display: grid; gap: 1px; background-color: #95a5a6; border: 3px solid #7f8c8d; user-select: none; }
        
        .cell {
            width: 30px; height: 30px; background-color: #bdc3c7; 
            display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 18px; cursor: pointer; user-select: none; 
            box-shadow: inset -2px -2px #7f8c8d, inset 2px 2px #fff; color: #2c3e50;
            position: relative; 
        }
        
        .cell:hover { filter: brightness(1.1); }
        .cell.revealed { background-color: #ecf0f1; box-shadow: inset 1px 1px #bdc3c7; }
        .cell.safe { background-color: #2ecc71; box-shadow: inset 1px 1px #27ae60; color: white;} 
        .cell.flagged { background-color: #e74c3c; box-shadow: inset 1px 1px #c0392b; color: white;} 
        .cell.guess { background-color: #3498db; box-shadow: inset 1px 1px #2980b9; color: white; font-size: 12px; }
        
        .val-1 { color: #2980b9; } .val-2 { color: #27ae60; } .val-3 { color: #c0392b; }
        .val-4 { color: #8e44ad; } .val-5 { color: #d35400; } .val-6 { color: #16a085; }
        .val-7 { color: #2c3e50; } .val-8 { color: #7f8c8d; }

        @keyframes pulseHighlight {
            0% { box-shadow: 0 0 4px #f1c40f; border: 3px solid #f1c40f; transform: scale(1); }
            50% { box-shadow: 0 0 12px #f1c40f; border: 3px solid #fff200; transform: scale(1.05); z-index: 10;}
            100% { box-shadow: 0 0 4px #f1c40f; border: 3px solid #f1c40f; transform: scale(1); }
        }
        .highlight-new { animation: pulseHighlight 1.2s infinite; box-sizing: border-box; z-index: 5; filter: brightness(1.2); }

        @keyframes pulseGuess {
            0% { box-shadow: 0 0 4px #3498db; transform: scale(1); }
            50% { box-shadow: 0 0 12px #3498db; transform: scale(1.05); z-index: 10;}
            100% { box-shadow: 0 0 4px #3498db; transform: scale(1); }
        }
        .highlight-guess { animation: pulseGuess 1.5s infinite; z-index: 6; }
    </style>
</head>
<body>

    <div class="instructions">
        <strong>MINESWEEPER SOLVER</strong><br>
        1. Click/Kéo Chuột Trái để điền nhanh số. <b>Click/Kéo Chuột Phải để cắm cờ hoặc XÓA nếu điền sai.</b><br>
        2. Nhấn phím <b>R</b> để chạy Giải nhanh (1 Bước). Nhấn <b>Ctrl + Z</b> để hoàn tác (Undo).
    </div>

    <div class="settings-container">
        <div class="size-panel">
            <strong style="color: #fff; text-shadow: 1px 1px 2px #000;">📐 KÍCH THƯỚC:</strong>
            <label style="color: white; margin-left: 5px;">Ngang: <input type="number" id="input-cols" value="18"></label>
            <label style="color: white; margin-left: 5px;">Dọc: <input type="number" id="input-rows" value="32"></label>
            <button onclick="applyBoardSize()">Áp dụng</button>
        </div>
        
        <div class="stats-panel">
            <strong style="color: #fff; text-shadow: 1px 1px 2px #000;">💣 TỔNG MÌN:</strong>
            <input type="number" id="total-mines" value="150" onchange="renderBoard()" onkeyup="renderBoard()">
            <span id="remaining-text" style="font-weight: bold; font-size: 16px; color: #fff; margin-left: 10px;">Còn lại: 150 🚩</span>
        </div>
    </div>

    <div class="keypad" id="toolbar">
        <button id="btn-Q" onclick="selectTool('Q')">Q (Ô Trống)</button>
        <button id="btn-1" class="active" onclick="selectTool(1)">1</button>
        <button id="btn-2" onclick="selectTool(2)">2</button>
        <button id="btn-3" onclick="selectTool(3)">3</button>
        <button id="btn-4" onclick="selectTool(4)">4</button>
        <button id="btn-5" onclick="selectTool(5)">5</button>
        <button id="btn-6" onclick="selectTool(6)">6</button>
        <button id="btn-7" onclick="selectTool(7)">7</button>
        <button id="btn-8" onclick="selectTool(8)">8</button>
        <button id="btn-F" onclick="selectTool('F')">🚩 Cờ (F)</button>
        <button id="btn-CLEAR" onclick="selectTool('CLEAR')">Xóa (X)</button>
    </div>

    <div class="controls">
        <button onclick="undo()" style="background-color: #95a5a6; color: #2c3e50;">Hoàn tác (Ctrl+Z)</button>
        <button onclick="initBoard()">Làm mới bảng</button>
        <button onclick="triggerSolve()" style="background-color: #e67e22;">Tìm ô An Toàn & Mìn [Phím R]</button>
        <button onclick="autoSolve()" style="background-color: #27ae60;">Giải liên tục đến khi kẹt</button>
    </div>

    <div class="board-wrapper">
        <div id="x-coords-top" class="x-coords x-coords-top"></div>
        <div style="display: flex;">
            <div id="y-coords-left" class="y-coords y-coords-left"></div>
            <div id="board"></div>
            <div id="y-coords-right" class="y-coords y-coords-right"></div>
        </div>
        <div id="x-coords-bottom" class="x-coords x-coords-bottom"></div>
    </div>

    <script>
        let COLS = 18;
        let ROWS = 32;
        let board = [];
        let boardHistory = []; 
        let currentTool = 1;

        // Trạng thái theo dõi thao tác kéo thả chuột
        let isDrawing = false;
        let drawButton = -1;
        let hasSavedForThisDrag = false;
        let lastDraggedCell = null; // Chống nháy click liên tục trong 1 ô

        document.addEventListener('mousedown', (e) => {
            isDrawing = true;
            drawButton = e.button;
            hasSavedForThisDrag = false;
            lastDraggedCell = null;
        });

        document.addEventListener('mouseup', () => {
            isDrawing = false;
            drawButton = -1;
            hasSavedForThisDrag = false;
            lastDraggedCell = null;
        });

        function saveState() {
            if (boardHistory.length > 50) boardHistory.shift(); 
            boardHistory.push(JSON.stringify(board));
        }

        function undo() {
            if (boardHistory.length > 0) {
                let previousState = boardHistory.pop();
                board = JSON.parse(previousState);
                renderBoard();
            }
        }

        function recordAction() {
            if (!hasSavedForThisDrag) {
                saveState();
                hasSavedForThisDrag = true;
            }
        }

        function applyBoardSize() {
            let newCols = parseInt(document.getElementById('input-cols').value);
            let newRows = parseInt(document.getElementById('input-rows').value);
            
            if (isNaN(newCols) || isNaN(newRows) || newCols <= 0 || newRows <= 0) {
                alert("Kích thước không hợp lệ. Vui lòng nhập số lớn hơn 0.");
                return;
            }
            
            COLS = newCols;
            ROWS = newRows;
            
            document.getElementById('x-coords-top').innerHTML = '';
            document.getElementById('x-coords-bottom').innerHTML = '';
            document.getElementById('y-coords-left').innerHTML = '';
            document.getElementById('y-coords-right').innerHTML = '';
            document.getElementById('board').innerHTML = '';
            
            initBoard();
        }

        function initBoard() {
            board = [];
            boardHistory = []; 
            for (let y = 0; y < ROWS; y++) {
                let row = [];
                for (let x = 0; x < COLS; x++) {
                    row.push({ x, y, state: 'hidden', value: null, isNew: false });
                }
                board.push(row);
            }
            setupCoordinates();
            createBoardDOM(); // Khởi tạo HTML DOM 1 lần duy nhất để tối ưu FPS
            renderBoard();
        }

        function setupCoordinates() {
            const xTop = document.getElementById('x-coords-top');
            const xBottom = document.getElementById('x-coords-bottom');
            
            xTop.style.gridTemplateColumns = `repeat(${COLS}, 30px)`;
            xBottom.style.gridTemplateColumns = `repeat(${COLS}, 30px)`;
            
            xTop.innerHTML = ''; xBottom.innerHTML = '';
            for (let x = 0; x < COLS; x++) {
                let el1 = document.createElement('div'); el1.className = 'coord'; el1.innerText = COLS - x; 
                let el2 = document.createElement('div'); el2.className = 'coord'; el2.innerText = x + 1;    
                xTop.appendChild(el1); xBottom.appendChild(el2);
            }
            
            const yLeft = document.getElementById('y-coords-left');
            const yRight = document.getElementById('y-coords-right');
            
            yLeft.style.gridTemplateRows = `repeat(${ROWS}, 30px)`;
            yRight.style.gridTemplateRows = `repeat(${ROWS}, 30px)`;

            yLeft.innerHTML = ''; yRight.innerHTML = '';
            for (let y = 0; y < ROWS; y++) {
                let el1 = document.createElement('div'); el1.className = 'coord'; el1.innerText = ROWS - y; 
                let el2 = document.createElement('div'); el2.className = 'coord'; el2.innerText = y + 1;    
                yLeft.appendChild(el1); yRight.appendChild(el2);
            }
        }

        // Tạo sẵn khung thẻ HTML để tái sử dụng
        function createBoardDOM() {
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${COLS}, 30px)`;
            boardEl.innerHTML = '';
            
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let el = document.createElement('div');
                    el.id = `cell-${y}-${x}`;
                    el.className = 'cell';

                    // Sự kiện Click đầu tiên
                    el.onmousedown = (e) => {
                        e.preventDefault(); 
                        recordAction(); 
                        lastDraggedCell = {x, y}; // Lưu lại vị trí để chống nháy

                        if (e.button === 0) {
                            applyToolToCell(x, y);
                        } else if (e.button === 2) {
                            handleRightClickAction(x, y);
                        }
                    };

                    // Sự kiện kéo chuột (Hover qua)
                    el.onmouseenter = (e) => {
                        if (isDrawing) {
                            // Nếu vẫn ở trong ô cũ thì không xử lý lại (tránh nháy xóa)
                            if (lastDraggedCell && lastDraggedCell.x === x && lastDraggedCell.y === y) return;
                            
                            recordAction(); 
                            lastDraggedCell = {x, y};
                            
                            if (drawButton === 0) {
                                applyToolToCell(x, y);
                            } else if (drawButton === 2) {
                                handleRightClickAction(x, y);
                            }
                        }
                    };

                    el.oncontextmenu = (e) => e.preventDefault();
                    boardEl.appendChild(el);
                }
            }
        }

        function selectTool(tool) {
            currentTool = tool;
            let buttons = document.querySelectorAll('#toolbar button');
            buttons.forEach(btn => btn.classList.remove('active'));
            let activeBtn = document.getElementById('btn-' + tool);
            if(activeBtn) activeBtn.classList.add('active');
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                e.preventDefault();
                undo();
                return;
            }

            let key = e.key.toUpperCase();
            let activeId = document.activeElement.id;
            if (activeId === 'total-mines' || activeId === 'input-cols' || activeId === 'input-rows') return; 
            
            if (key >= '1' && key <= '8') selectTool(parseInt(key));
            else if (key === 'Q') selectTool('Q'); 
            else if (key === 'F') selectTool('F');
            else if (key === 'BACKSPACE' || key === 'DELETE' || key === 'X') selectTool('CLEAR');
            else if (key === 'R') triggerSolve();
        });

        function clearHighlights() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    board[y][x].isNew = false;
                }
            }
        }

        function clearGuesses() {
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x].state === 'guess') {
                        board[y][x].state = 'hidden';
                        delete board[y][x].guessProb;
                    }
                }
            }
        }

        // Logic chuột trái
        function applyToolToCell(x, y) {
            let cell = board[y][x];
            let changed = false;

            if (currentTool === 'CLEAR') {
                if (cell.state !== 'hidden' || cell.value !== null || cell.isNew) { 
                    cell.state = 'hidden'; cell.value = null; cell.isNew = false; changed = true; 
                }
            } else if (currentTool === 'F') {
                if (cell.state !== 'flagged' || cell.isNew) { 
                    cell.state = 'flagged'; cell.value = null; cell.isNew = false; changed = true; 
                }
            } else if (currentTool === 'Q') {
                if (cell.state !== 'revealed' || cell.value !== 0 || cell.isNew) { 
                    cell.state = 'revealed'; cell.value = 0; cell.isNew = false; changed = true; 
                }
            } else if (currentTool >= 1 && currentTool <= 8) {
                let val = parseInt(currentTool);
                if (cell.state !== 'revealed' || cell.value !== val || cell.isNew) { 
                    cell.state = 'revealed'; cell.value = val; cell.isNew = false; changed = true; 
                }
            }

            if (changed) {
                clearGuesses();
                renderBoard();
            }
        }

        // Logic chuột phải (Xóa hoặc Cắm cờ)
        function handleRightClickAction(x, y) {
            clearGuesses();
            let cell = board[y][x];
            if (cell.state !== 'hidden' && cell.state !== 'guess') {
                cell.state = 'hidden';
                cell.value = null;
            } else {
                cell.state = 'flagged';
            }
            cell.isNew = false; 
            renderBoard();
        }

        function getNeighbors(x, y) {
            let neighbors = [];
            for (let dy = -1; dy <= 1; dy++) {
                for (let dx = -1; dx <= 1; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    let nx = x + dx, ny = y + dy;
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        neighbors.push(board[ny][nx]);
                    }
                }
            }
            return neighbors;
        }

        // Hàm Render mới: Chỉ cập nhật class và text, KHÔNG load lại thẻ div
        function renderBoard() {
            let flagCount = 0;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x].state === 'flagged') flagCount++;
                }
            }

            let totalInput = parseInt(document.getElementById('total-mines').value);
            let remText = document.getElementById('remaining-text');
            if (!isNaN(totalInput) && totalInput > 0) {
                let rem = totalInput - flagCount;
                remText.innerText = `Còn lại: ${rem} 🚩`;
                remText.style.color = (rem === 0) ? '#f1c40f' : (rem < 0 ? '#e74c3c' : '#fff');
            } else {
                remText.innerText = `Đã cắm: ${flagCount} 🚩`;
                remText.style.color = '#fff';
            }

            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let cell = board[y][x];
                    let el = document.getElementById(`cell-${y}-${x}`);
                    if (!el) continue;

                    // Xóa các class cũ và đặt lại class cơ bản
                    el.className = 'cell';
                    el.innerText = '';

                    // Cập nhật trạng thái hiển thị
                    if (cell.state === 'revealed') {
                        el.classList.add('revealed');
                        if (cell.value > 0) {
                            el.innerText = cell.value;
                            el.classList.add('val-' + cell.value);
                        }
                    } else if (cell.state === 'flagged') {
                        el.classList.add('flagged'); el.innerText = '🚩';
                    } else if (cell.state === 'safe') {
                        el.classList.add('safe'); el.innerText = '✓'; 
                    } else if (cell.state === 'guess') {
                        el.classList.add('guess'); 
                        el.innerText = cell.guessProb + '%';
                        el.classList.add('highlight-guess');
                    }

                    // Viền sáng
                    if (cell.isNew && cell.state !== 'guess') {
                        el.classList.add('highlight-new');
                    }
                }
            }
        }

        function solveBasic() {
            let madeProgress = false;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    let cell = board[y][x];
                    if (cell.state === 'revealed' && cell.value > 0) {
                        let neighbors = getNeighbors(x, y);
                        let hidden = neighbors.filter(n => n.state === 'hidden' || n.state === 'guess');
                        let flags = neighbors.filter(n => n.state === 'flagged');

                        if (hidden.length > 0 && flags.length + hidden.length === cell.value) {
                            hidden.forEach(n => { n.state = 'flagged'; n.isNew = true; madeProgress = true; });
                        }
                        if (hidden.length > 0 && flags.length === cell.value) {
                            hidden.forEach(n => { n.state = 'safe'; n.isNew = true; madeProgress = true; });
                        }
                    }
                }
            }
            return madeProgress;
        }

        window.lastBestGuess = null; 
        
        function solveAdvanced() {
            let madeProgress = false;
            let constraints = [];
            window.lastBestGuess = null; 

            for(let y=0; y<ROWS; y++) {
                for(let x=0; x<COLS; x++) {
                    let cell = board[y][x];
                    if (cell.state === 'revealed' && cell.value > 0) {
                        let neighbors = getNeighbors(x, y);
                        let hidden = neighbors.filter(n => n.state === 'hidden' || n.state === 'guess');
                        if (hidden.length > 0) {
                            let flags = neighbors.filter(n => n.state === 'flagged').length;
                            constraints.push({ x, y, target: cell.value - flags, hiddenNeighbors: hidden });
                        }
                    }
                }
            }

            if (constraints.length === 0) return false;

            let borderSet = new Set();
            constraints.forEach(c => c.hiddenNeighbors.forEach(n => borderSet.add(`${n.x},${n.y}`)));
            let borderCells = Array.from(borderSet).map(s => {
                let [x, y] = s.split(',').map(Number);
                return board[y][x];
            });

            let regions = [];
            let unvisitedBorders = new Set(borderCells);
            
            while(unvisitedBorders.size > 0) {
                let startCell = unvisitedBorders.values().next().value;
                let currentRegionBorders = [];
                let currentRegionConstraints = new Set();
                let queue = [startCell];
                unvisitedBorders.delete(startCell);
                
                while(queue.length > 0) {
                    let curr = queue.shift();
                    currentRegionBorders.push(curr);
                    let linkedConstraints = constraints.filter(c => c.hiddenNeighbors.includes(curr));
                    linkedConstraints.forEach(c => {
                        currentRegionConstraints.add(c);
                        c.hiddenNeighbors.forEach(n => {
                            if (unvisitedBorders.has(n)) { unvisitedBorders.delete(n); queue.push(n); }
                        });
                    });
                }
                regions.push({ borders: currentRegionBorders, constraints: Array.from(currentRegionConstraints) });
            }

            let localBestGuess = null;
            let localLowestProb = 1.1;

            regions.forEach(region => {
                let validCount = 0;
                let mineCounts = new Array(region.borders.length).fill(0);
                let borderIndexMap = new Map();
                region.borders.forEach((b, i) => borderIndexMap.set(`${b.x},${b.y}`, i));
                let currentPlacement = new Array(region.borders.length).fill(false);
                
                let iterations = 0;
                let maxIterations = 500000; 
                let tooComplex = false;

                function backtrack(idx) {
                    if (tooComplex) return;
                    iterations++;
                    if (iterations > maxIterations) { tooComplex = true; return; }

                    for (let c of region.constraints) {
                        let currentMines = 0; let possibleRemaining = 0;
                        for (let n of c.hiddenNeighbors) {
                            let i = borderIndexMap.get(`${n.x},${n.y}`);
                            if (i < idx) {
                                if (currentPlacement[i]) currentMines++;
                            } else {
                                possibleRemaining++;
                            }
                        }
                        if (currentMines > c.target) return; 
                        if (currentMines + possibleRemaining < c.target) return; 
                    }

                    if (idx === region.borders.length) {
                        validCount++;
                        for (let i = 0; i < currentPlacement.length; i++) {
                            if (currentPlacement[i]) mineCounts[i]++;
                        }
                        return;
                    }

                    currentPlacement[idx] = true; backtrack(idx + 1);
                    if (!tooComplex) { currentPlacement[idx] = false; backtrack(idx + 1); }
                }

                backtrack(0);

                if (!tooComplex && validCount > 0) {
                    for (let i = 0; i < region.borders.length; i++) {
                        let b = region.borders[i];
                        let prob = mineCounts[i] / validCount;

                        if (prob === 1) {
                            b.state = 'flagged'; b.isNew = true; madeProgress = true;
                        } else if (prob === 0) {
                            b.state = 'safe'; b.isNew = true; madeProgress = true;
                        } else {
                            if (prob < localLowestProb) {
                                localLowestProb = prob;
                                localBestGuess = b;
                            }
                        }
                    }
                }
            });

            if (!madeProgress && localBestGuess) {
                window.lastBestGuess = { cell: localBestGuess, prob: localLowestProb };
            }

            return madeProgress;
        }

        function solveGlobal() {
            let totalInput = parseInt(document.getElementById('total-mines').value);
            if (isNaN(totalInput) || totalInput <= 0) return false;

            let hiddenCells = [];
            let flagCount = 0;
            for (let y = 0; y < ROWS; y++) {
                for (let x = 0; x < COLS; x++) {
                    if (board[y][x].state === 'hidden' || board[y][x].state === 'guess') hiddenCells.push(board[y][x]);
                    if (board[y][x].state === 'flagged') flagCount++;
                }
            }

            if (hiddenCells.length === 0) return false;
            let remaining = totalInput - flagCount;
            let madeProgress = false;

            if (remaining === 0) {
                hiddenCells.forEach(cell => { cell.state = 'safe'; cell.isNew = true; madeProgress = true; });
            } else if (remaining === hiddenCells.length) {
                hiddenCells.forEach(cell => { cell.state = 'flagged'; cell.isNew = true; madeProgress = true; });
            }
            return madeProgress;
        }

        function triggerSolve(isAuto = false) {
            if (!isAuto) saveState(); 
            clearHighlights(); 
            clearGuesses();

            let progress = solveBasic();
            if (!progress) progress = solveAdvanced();
            if (!progress) progress = solveGlobal();

            if (progress) {
                renderBoard();
                return true;
            } else {
                if (window.lastBestGuess) {
                    window.lastBestGuess.cell.state = 'guess';
                    window.lastBestGuess.cell.guessProb = (window.lastBestGuess.prob * 100).toFixed(0);
                    renderBoard();
                    console.log("Đã kẹt! Đang hiển thị Gợi ý có xác suất mìn thấp nhất.");
                }
                return false;
            }
        }

        function autoSolve() {
            saveState(); 
            let interval = setInterval(() => {
                let progress = triggerSolve(true); 
                if (!progress) clearInterval(interval);
            }, 150); 
        }

        initBoard();
    </script>
</body>
</html>
